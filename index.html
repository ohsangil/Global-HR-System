<div id="elena-inspection-room" style="width: 100%; height: 100vh; background: #000; position: relative; overflow: hidden; font-family: 'Courier New', Courier, monospace;">
    
    <div id="main-stream" style="width: 85%; height: 70%; margin: 50px auto; background: #050505; border: 1px solid #222; position: relative; display: flex; justify-content: center; align-items: center; box-shadow: inset 0 0 50px #000;">
        <div style="text-align: center;">
            <div style="font-size: 1.5rem; color: #333; letter-spacing: 10px; margin-bottom: 20px;">[ LECTURE CONTENT STREAMING ]</div>
            <div style="width: 300px; height: 2px; background: linear-gradient(90deg, transparent, #00c3ff, transparent); margin: 0 auto;"></div>
        </div>
    </div>

    <div id="elena-eye" style="position: absolute; top: 30px; right: 30px; width: 220px; background: rgba(0, 10, 20, 0.9); border: 1px solid gold; border-radius: 15px; padding: 20px; text-align: center; box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);">
        <div style="color: gold; font-size: 0.7rem; letter-spacing: 2px; margin-bottom: 10px;">AI INSPECTOR ELENA</div>
        <div style="width: 80px; height: 80px; border-radius: 50%; border: 2px solid gold; margin: 0 auto; overflow: hidden; background: #111;">
             <div style="width: 20px; height: 20px; background: gold; border-radius: 50%; margin: 30px auto; filter: blur(2px); animation: moveEye 3s infinite;"></div>
        </div>
        <div style="margin-top: 15px; font-size: 0.8rem; color: #0f0;">STATUS: EYE-TRACKING...</div>
        <div id="focus-timer" style="font-size: 0.7rem; color: #555; margin-top: 5px;">시선 이탈 감지: 0.0s</div>
    </div>

    <div style="position: absolute; bottom: 0; width: 100%; height: 120px; background: rgba(10, 10, 10, 0.95); border-top: 2px solid gold; display: flex; justify-content: space-around; align-items: center; padding: 0 50px;">
        <div style="text-align: center;">
            <p style="color: #666; font-size: 0.7rem; margin: 0;">CURRENT PROGRESS</p>
            <p style="color: gold; font-size: 1.8rem; font-weight: bold; margin: 5px 0;">42 : 140 <span style="font-size: 0.8rem;">MIN</span></p>
        </div>

        <div style="text-align: center; padding: 0 40px; border-left: 1px solid #222; border-right: 1px solid #222;">
            <p style="color: #666; font-size: 0.7rem; margin: 0;">STRIKE SYSTEM</p>
            <p style="color: #ff4444; font-size: 1.8rem; font-weight: bold; margin: 5px 0;">[ X ] [ _ ] [ _ ]</p>
            <p style="color: #444; font-size: 0.6rem;">3회 위반 시 당일 공정 무효</p>
        </div>

        <div style="text-align: left;">
            <p style="color: #0f0; font-size: 0.7rem; margin: 0;">LOCATION VERIFICATION</p>
            <p style="color: #ccc; font-size: 0.9rem; margin: 5px 0;">SEOUL, SOUTH KOREA (GPS ACTIVE)</p>
        </div>
    </div>

    <style>
        @keyframes moveEye { 0%, 100% { transform: translateX(-15px); } 50% { transform: translateX(15px); } }
    </style>
</div>
