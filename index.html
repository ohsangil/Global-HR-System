<div id="intro-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, #1a1a1a 0%, #000 100%); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: 1.5s ease-out;">
    
    <div id="logo-container" style="position: relative; width: 300px; height: 300px;">
        <div style="position: absolute; width: 100%; height: 100%; border: 4px solid gold; border-radius: 50%; border-top-color: transparent; animation: spin 3s linear infinite;"></div>
        
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center;">
            <h1 style="color: gold; font-family: 'Georgia', serif; font-size: 4rem; margin: 0; letter-spacing: 10px; text-shadow: 0 0 20px gold;">WBPC</h1>
            <p style="color: #fff; font-size: 0.8rem; letter-spacing: 5px; margin-top: 10px; opacity: 0.7;">GLOBAL COMMAND</p>
        </div>
    </div>

    <div style="margin-top: 50px; text-align: center;">
        <button onclick="enterCommandCenter()" style="background: none; border: 1px solid gold; color: gold; padding: 15px 40px; font-size: 1.2rem; cursor: pointer; letter-spacing: 5px; transition: 0.5s; overflow: hidden; position: relative;" onmouseover="this.style.background='gold'; this.style.color='#000';" onmouseout="this.style.background='none'; this.style.color='gold';">
            ENTER SYSTEM
        </button>
    </div>
</div>

<script>
    function enterCommandCenter() {
        const intro = document.getElementById('intro-overlay');
        intro.style.opacity = '0';
        setTimeout(() => {
            intro.style.display = 'none';
        }, 1500);
    }
</script>

<style>
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
</style>
