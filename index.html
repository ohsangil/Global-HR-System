
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WBPC GLOBAL HR - STRATEGIC COMMAND</title>
    <style>
        /* 기본 레이아웃 */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; color: #ffd700; font-family: 'Malgun Gothic', sans-serif; overflow: hidden; }
        
        /* 입장 화면 */
        #entry-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; background: radial-gradient(circle, #222 0%, #000 100%); transition: 1s; }
        .gold-logo-box { width: 150px; height: 150px; border-radius: 50%; background: linear-gradient(145deg, #d4af37, #8a6d3b); border: 5px solid #ffd700; display: flex; justify-content: center; align-items: center; box-shadow: 0 0 30px gold; margin-bottom: 20px; }
        .gold-logo-box span { font-size: 2rem; font-weight: 900; color: #000; }
        .country-selector { display: flex; gap: 20px; margin-bottom: 40px; }
        .btn-3d { width: 100px; height: 70px; border: none; border-radius: 10px; background: #222; color: #888; cursor: pointer; transition: 0.3s; box-shadow: 5px 5px 15px #000; }
        .btn-3d.selected { background: #1a1a1a; color: gold; border: 1px solid gold; box-shadow: 0 0 20px gold; transform: scale(1.1); }
        .enter-btn { padding: 15px 60px; font-size: 1.2rem; font-weight: bold; background: #111; border: 1px solid #444; color: #444; border-radius: 30px; cursor: not-allowed; transition: 0.5s; letter-spacing: 5px; }
        .enter-btn.ready { color: gold; border-color: gold; cursor: pointer; box-shadow: 0 0 20px rgba(212, 175, 55, 0.4); }

        /* 내부 대시보드 (본진) */
        #main-dashboard { display: none; width: 100%; height: 100vh; background: linear-gradient(180deg, #000 0%, #0a0a0a 100%); padding: 40px; box-sizing: border-box; flex-direction: column; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid gold; padding-bottom: 20px; margin-bottom: 30px; }
        .header h1 { margin: 0; letter-spacing: 10px; font-size: 2rem; text-shadow: 0 0 10px gold; }
        
        .grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; flex-grow: 1; }
        .stat-card { background: rgba(20, 20, 20, 0.8); border: 1px solid #333; border-radius: 15px; padding: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .stat-card::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 5px; background: gold; }
        .stat-label { font-size: 1.1rem; color: #888; letter-spacing: 2px; margin-bottom: 15px; }
        .stat-value { font-size: 3.5rem; font-weight: bold; color: #fff; text-shadow: 0 0 20px rgba(255,255,255,0.5); }
        .stat-unit { font-size: 1rem; color: gold; margin-left: 5px; }

        /* 실시간 스캔 효과 */
        .scanning { position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: rgba(255, 215, 0, 0.5); animation: scan 3s infinite linear; }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
    </style>
</head>
<body>

    <div id="entry-screen">
        <div class="gold-logo-box"><span>WBPC</span></div>
        <h2 id="status-text">SYSTEM STATUS: LOCKED</h2>
        <div class="country-selector">
            <button class="btn-3d" onclick="selectCountry(this, '대한민국')">KR</button>
            <button class="btn-3d" onclick="selectCountry(this, '태국')">TH</button>
            <button class="btn-3d" onclick="selectCountry(this, '라오스')">LA</button>
            <button class="btn-3d" onclick="selectCountry(this, '미얀마')">MM</button>
        </div>
        <button id="enter-btn" class="enter-btn" onclick="activateSystem()">SYSTEM ENTER</button>
    </div>

    <div id="main-dashboard">
        <div class="header">
            <h1 id="dashboard-title">KOREA STRATEGIC COMMAND</h1>
            <div style="text-align: right; color: #0f0; font-family: monospace;">● SYSTEM ONLINE</div>
        </div>

        <div class="grid-container">
            <div class="stat-card">
                <div class="scanning"></div>
                <div class="stat-label">TOTAL PERSONNEL</div>
                <div class="stat-value">1,284<span class="stat-unit">명</span></div>
            </div>
            <div class="stat-card">
                <div class="scanning"></div>
                <div class="stat-label">ACTIVE RECRUITING</div>
                <div class="stat-value">42<span class="stat-unit">건</span></div>
            </div>
            <div class="stat-card">
                <div class="scanning"></div>
                <div class="stat-label">PENDING APPROVAL</div>
                <div class="stat-value" style="color: #ff4444;">12<span class="stat-unit">건</span></div>
            </div>
        </div>

        <div style="margin-top: 30px; padding: 20px; border: 1px solid #222; color: #555; font-family: monospace; font-size: 0.9rem;">
            > INITIALIZING BIOMETRIC SCAN... DONE<br>
            > LOADING GLOBAL HR DATABASE... DONE<br>
            > WELCOME, COMMANDER. ACCESS GRANTED.
        </div>
    </div>

    <script>
        let selectedCountry = "";
        function selectCountry(btn, country) {
            document.querySelectorAll('.btn-3d').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedCountry = country;
            document.getElementById('status-text').innerText = "SECTOR: " + country;
            document.getElementById('status-text').style.color = "gold";
            document.getElementById('enter-btn').classList.add('ready');
        }

        function activateSystem() {
            if(!selectedCountry) return;
            document.getElementById('dashboard-title').innerText = selectedCountry.toUpperCase() + " STRATEGIC COMMAND";
            document.getElementById('entry-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('entry-screen').style.display = 'none';
                document.getElementById('main-dashboard').style.display = 'flex';
            }, 1000);
        }
    </script>
</body>
</html>
