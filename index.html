<div id="cycle-controller" style="width: 100%; padding: 30px; background: rgba(0,0,0,0.5); border-radius: 20px; border: 1px dashed gold;">
    
    <div style="display: flex; justify-content: center; align-items: center; gap: 50px;">
        <div id="current-mode-box" style="text-align: center; padding: 20px 50px; border-radius: 15px; background: linear-gradient(145deg, #111, #000); border: 2px solid gold; min-width: 300px;">
            <h4 id="mode-label" style="color: gold; margin: 0; letter-spacing: 5px;">현재 상태: 교육 중</h4>
            <div id="timer-display" style="font-size: 3.5rem; font-weight: 900; color: #fff; font-family: 'Courier New', monospace; margin-top: 10px;">20:00</div>
        </div>

        <div style="color: #888; font-size: 1rem;">
            NEXT PHASE: <span style="color: #fff;">10분 휴식 (자동 전환)</span><br>
            <p style="margin-top: 5px; font-size: 0.8rem;">* 10초 감시 시스템 상시 가동 중</p>
        </div>
    </div>

    <div style="width: 100%; height: 8px; background: #222; margin-top: 30px; border-radius: 4px; overflow: hidden;">
        <div id="cycle-progress" style="width: 100%; height: 100%; background: gold; transition: 1s linear;"></div>
    </div>
</div>

<script>
    let timeLeft = 1200; // 20분 (초 단위)
    let isEducation = true;

    const timerInt = setInterval(() => {
        timeLeft--;
        updateTimerUI();

        if (timeLeft <= 0) {
            switchCycle();
        }
    }, 1000);

    function updateTimerUI() {
        const min = Math.floor(timeLeft / 60);
        const sec = timeLeft % 60;
        document.getElementById('timer-display').innerText = 
            `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
        
        // 게이지 줄어들기
        const percent = (timeLeft / (isEducation ? 1200 : 600)) * 100;
        document.getElementById('cycle-progress').style.width = percent + "%";
    }

    function switchCycle() {
        isEducation = !isEducation;
        if (isEducation) {
            timeLeft = 1200; // 20분 교육
            document.getElementById('mode-label').innerText = "현재 상태: 교육 중";
            document.getElementById('mode-label').style.color = "gold";
        } else {
            timeLeft = 600; // 10분 휴식
            document.getElementById('mode-label').innerText = "현재 상태: 휴식 중";
            document.getElementById('mode-label').style.color = "#0f0";
            alert("20분 교육 종료. 10분간 휴식하십시오.");
        }
    }
</script>
