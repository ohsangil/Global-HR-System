<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WBPC GLOBAL HR - 전략 지휘 센터</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; color: #ffd700; font-family: 'Malgun Gothic', sans-serif; overflow: hidden; }
        
        #entry-screen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            z-index: 1000; background: radial-gradient(circle, #222 0%, #000 100%); transition: 0.8s; 
        }

        /* 3D 골드 로고 */
        .gold-logo-3d { 
            width: 140px; height: 140px; border-radius: 50%; 
            background: linear-gradient(145deg, #d4af37, #8a6d3b); 
            border: 6px solid #ffd700; display: flex; justify-content: center; align-items: center; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 15px #fff; margin-bottom: 20px; 
        }
        .gold-logo-3d span { font-size: 1.8rem; font-weight: 900; color: #000; }

        h2 { letter-spacing: 6px; font-weight: 300; margin-bottom: 40px; text-shadow: 0 0 10px gold; font-size: 1.4rem; }

        /* 4개국 버튼 정렬 */
        .country-selector { display: flex; gap: 30px; margin-bottom: 60px; }
        
        .btn-3d { 
            width: 120px; height: 85px; border: 3px solid #444; border-radius: 12px; 
            background: linear-gradient(145deg, #333, #000); 
            box-shadow: 8px 8px 16px #000, -2px -2px 10px #444; 
            cursor: pointer; 
            display: flex; justify-content: center; align-items: center; 
            transition: 0.4s; position: relative;
            overflow: hidden;
        }

        /* 버튼 중앙 국기 크기 확대 */
        .btn-3d span {
            font-size: 3.5rem; /* 국기 크기를 훨씬 크게 */
            line-height: 1;
            transition: 0.3s;
        }
        
        /* 국가 이름 하단 라벨 */
        .btn-3d::after {
            content: attr(data-name); position: absolute; bottom: -30px; 
            font-size: 0.9rem; color: #888; letter-spacing: 1px; white-space: nowrap;
        }

        .btn-3d:hover { transform: translateY(-8px); border-color: #ffd700; box-shadow: 0 0 30px gold; }
        .btn-3d:hover span { transform: scale(1.15); } /* 마우스 올리면 국기가 툭 튀어나옴 */
        
        .btn-3d.selected { 
            border-color: #ffd700; background: #222; 
            box-shadow: 0 0 35px #ffd700, inset 0 0 15px gold;
            transform: scale(1.1);
        }
        .btn-3d.selected::after { color: #ffd700; font-weight: bold; }

        /* 3D 입장 버튼 */
        .enter-btn-3d { 
            padding: 20px 80px; font-size: 1.4rem; font-weight: bold; letter-spacing: 8px; 
            color: #444; border: 3px solid #444; border-radius: 15px; 
            background: #111; cursor: not-allowed; transition: 0.4s;
        }
        .enter-btn-3d.ready { 
            color: #ffd700; border-color: #ffd700; cursor: pointer;
            box-shadow: 10px 10px 25px #000, -5px -5px 15px #222;
        }
        .enter-btn-3d.ready:hover { background: #ffd700; color: #000; box-shadow: 0 0 40px #ffd700; }

        /* 내부 지휘소 */
        #main-hr { width: 100%; height: 100vh; display: none; flex-direction: column; justify-content: center; align-items: center; background: #000; }
        .hr-box { border: 10px double #ffd700; padding: 60px; box-shadow: 0 0 50px gold; text-align: center; }
    </style>
</head>
<body>

    <div id="entry-screen">
        <div class="gold-logo-3d"><span>WBPC</span></div>
        <h2 id="top-title">접속할 국가 섹터를 선택하십시오</h2>
        
        <div class="country-selector">
            <button class="btn-3d" data-name="대한민국" onclick="selectCountry(this, '대한민국')"><span>🇰🇷</span></button>
            <button class="btn-3d" data-name="태국" onclick="selectCountry(this, '태국')"><span>🇹🇭</span></button>
            <button class="btn-3d" data-name="라오스" onclick="selectCountry(this, '라오스')"><span>🇱🇦</span></button>
            <button class="btn-3d" data-name="미얀마" onclick="selectCountry(this, '미얀마')"><span>🇲🇲</span></button>
        </div>

        <button id="enter-button" class="enter-btn-3d" onclick="openGate()">SYSTEM ENTER</button>
    </div>

    <div id="main-hr">
        <div class="hr-box">
            <h1 style="font-size: 3rem; letter-spacing: 12px;">WBPC GLOBAL HR</h1>
            <p id="sector-info" style="color: #fff; letter-spacing: 5px; font-size: 1.8rem; margin-top: 20px;"></p>
            <div style="margin-top:30px; color:#00ff00; font-family:monospace;">
                > 보안 연결 수립 완료<br>
                > 글로벌 인적자원 지휘 시스템 가동 중
            </div>
        </div>
    </div>

    <script>
        let selectedSector = "";

        function selectCountry(element, country) {
            document.querySelectorAll('.btn-3d').forEach(btn => btn.classList.remove('selected'));
            element.classList.add('selected');
            selectedSector = country;
            
            const enterBtn = document.getElementById('enter-button');
            enterBtn.classList.add('ready');
            
            document.getElementById('top-title').innerText = country + " 섹터 활성화됨";
            document.getElementById('top-title').style.color = "#ffd700";
        }

        function openGate() {
            if(!selectedSector) return;
            document.getElementById('entry-screen').style.opacity = '0';
            document.getElementById('sector-info').innerText = selectedSector + " 전략 지휘 본부";
            setTimeout(() => {
                document.getElementById('entry-screen').style.display = 'none';
                document.getElementById('main-hr').style.display = 'flex';
            }, 800);
        }
    </script>
</body>
</html>
