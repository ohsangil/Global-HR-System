<div id="lecture-command-center" style="width: 100%; height: 100vh; background: #000; color: #fff; position: relative; overflow: hidden;">
    
    <div id="video-area" style="width: 80%; height: 75%; margin: 0 auto; background: #111; border: 2px solid #333; position: relative; top: 50px; display: flex; justify-content: center; align-items: center;">
        <h2 style="color: #444; letter-spacing: 10px;">LECTURE STREAMING...</h2>
        </div>

    <div id="elena-monitor" style="position: absolute; top: 20px; right: 20px; width: 250px; background: rgba(0, 0, 0, 0.8); border: 2px solid gold; border-radius: 15px; padding: 15px; text-align: center; box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);">
        <div style="width: 60px; height: 60px; border-radius: 50%; border: 2px solid gold; margin: 0 auto; overflow: hidden;">
            <img src="https://img.icons8.com/clouds/100/000000/female-profile.png" style="width: 100%;">
        </div>
        <p style="color: gold; font-size: 0.8rem; margin: 10px 0 5px;">AI INSTRUCTOR ELENA</p>
        <div style="font-size: 0.7rem; color: #0f0;">● EYE-TRACKING ACTIVE</div>
        
        <div style="width: 100%; height: 5px; background: #222; margin-top: 15px; border-radius: 5px; overflow: hidden;">
            <div id="focus-bar" style="width: 100%; height: 100%; background: #0f0; transition: 0.5s;"></div>
        </div>
    </div>

    <div style="position: absolute; bottom: 0; width: 100%; height: 100px; background: rgba(20, 20, 20, 0.9); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #d4af37;">
        <div style="text-align: center;">
            <p style="color: #888; margin: 0; font-size: 0.8rem;">TODAY'S PROCESS</p>
            <p style="color: gold; font-size: 1.5rem; font-weight: bold; margin: 0;">45 / 140 MIN</p>
        </div>
        
        <div style="text-align: center;">
            <p style="color: #888; margin: 0; font-size: 0.8rem;">STRIKE COUNT</p>
            <p id="strike-display" style="color: #ff4444; font-size: 1.5rem; font-weight: bold; margin: 0;">[ 0 / 3 ]</p>
        </div>

        <button onclick="emergencyExit()" style="background: transparent; border: 1px solid #555; color: #555; padding: 10px 25px; border-radius: 5px;">PAUSE SESSION</button>
    </div>

</div>

<script>
    // 10초 이상 시선 이탈 시 스트라이크 로직 시뮬레이션
    let strikeCount = 0;
    function detectDistraction() {
        strikeCount++;
        document.getElementById('strike-display').innerText = `[ ${strikeCount} / 3 ]`;
        alert("엘레나 경고: 10초 이상 시선이 이탈되었습니다! (누적 " + strikeCount + "회)");
        if(strikeCount >= 3) {
            alert("공정 실패: 오늘의 교육이 초기화됩니다. 사령관님께 보고됩니다.");
            location.reload();
        }
    }
</script>
