<div id="content-master-control" style="width: 100%; text-align: center; color: #fff;">
    
    <div style="margin-bottom: 30px;">
        <span style="color: #888; font-size: 0.9rem; letter-spacing: 2px;">COURSE PROGRESS</span>
        <div style="width: 60%; height: 4px; background: #222; margin: 10px auto; border-radius: 2px;">
            <div id="progress-indicator" style="width: 15%; height: 100%; background: gold; box-shadow: 0 0 10px gold; transition: 1s;"></div>
        </div>
    </div>

    <div id="lecture-card" style="padding: 40px; border: 1px solid rgba(255,215,0,0.2); background: rgba(212,175,55,0.02); border-radius: 15px;">
        <h3 id="step-title" style="color: #888; font-size: 1.2rem;">STEP 01: 모음의 이해</h3>
        <div id="main-display" style="font-size: 6rem; font-weight: 900; margin: 40px 0; text-shadow: 0 0 30px gold;">
            ㅏ ㅑ ㅓ ㅕ
        </div>
        <div id="sub-display" style="font-size: 2rem; color: #ffd700; opacity: 0.7;">
            [ a / ya / eo / yeo ]
        </div>
    </div>

    <div style="margin-top: 50px; display: flex; justify-content: center; gap: 30px;">
        <button onclick="prevStep()" style="padding: 10px 30px; background: none; border: 1px solid #444; color: #444; cursor: pointer;">PREV</button>
        <button onclick="nextStep()" style="padding: 10px 30px; background: gold; border: none; color: #000; font-weight: bold; cursor: pointer; border-radius: 5px;">NEXT STEP</button>
    </div>
</div>

<script>
    const steps = [
        {title: "STEP 01: 모음의 이해", main: "ㅏ ㅑ ㅓ ㅕ", sub: "[ a / ya / eo / yeo ]", prog: "20%"},
        {title: "STEP 02: 자음의 이해", main: "ㄱ ㄴ ㄷ ㄹ", sub: "[ g / n / d / r ]", prog: "40%"},
        {title: "STEP 03: 결합의 기초", main: "가 나 다 라", sub: "[ ga / na / da / ra ]", prog: "60%"}
    ];
    let currentStep = 0;

    function nextStep() {
        if(currentStep < steps.length - 1) {
            currentStep++;
            updateUI();
        }
    }

    function updateUI() {
        document.getElementById('step-title').innerText = steps[currentStep].title;
        document.getElementById('main-display').innerText = steps[currentStep].main;
        document.getElementById('sub-display').innerText = steps[currentStep].sub;
        document.getElementById('progress-indicator').style.width = steps[currentStep].prog;
    }
</script>
