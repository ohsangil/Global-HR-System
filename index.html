<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WBPC GLOBAL HR - 전략 지휘 센터</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; color: #ffd700; font-family: 'Malgun Gothic', sans-serif; overflow: hidden; }
        
        #entry-screen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            z-index: 1000; background: radial-gradient(circle, #222 0%, #000 100%); transition: 0.8s; 
        }

        /* 럭셔리 3D 골드 로고 */
        .gold-logo-3d { 
            width: 150px; height: 150px; border-radius: 50%; 
            background: linear-gradient(145deg, #d4af37, #8a6d3b); 
            border: 8px solid #ffd700; display: flex; justify-content: center; align-items: center; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.9), inset 0 0 25px #fff; margin-bottom: 25px; 
        }
        .gold-logo-3d span { font-size: 2.2rem; font-weight: 900; color: #000; text-shadow: 1px 1px 2px rgba(255,255,255,0.3); }

        h2 { letter-spacing: 8px; font-weight: 300; margin-bottom: 50px; text-shadow: 0 0 15px gold; font-size: 1.5rem; }

        /* 깊은 그림자가 있는 3D 국가 버튼 */
        .country-selector { display: flex; gap: 35px; margin-bottom: 60px; }
        
        .btn-3d { 
            width: 130px; height: 90px; border: none; border-radius: 15px; 
            background: linear-gradient(145deg, #3a3a3a, #0a0a0a); 
            box-shadow: 10px 10px 20px #000, -4px -4px 12px #444; 
            cursor: pointer; display: flex; justify-content: center; align-items: center; 
            transition: 0.4s; position: relative;
        }

        .btn-3d span { font-size: 4rem; line-height: 1; transition: 0.3s; filter: drop-shadow(2px 4px 6px black); }
        
        .btn-3d::after {
            content: attr(data-name); position: absolute; bottom: -35px; 
            font-size: 1rem; color: #666; letter-spacing: 2px;
        }

        .btn-3d:hover { transform: translateY(-10px); box-shadow: 0 0 35px gold; }
        .btn-3d:hover span { transform: scale(1.1); }
        
        .btn-3d.selected { 
            border: 3px solid #ffd700; background: #1a1a1a; 
            box-shadow: 0 0 40px #ffd700, inset 0 0 20px gold;
            transform: scale(1.1);
        }
        .btn-3d.selected::after { color: #ffd700; font-weight: bold; }

        /* 웅장한 3D 입장 버튼 */
        .enter-btn-3d { 
            padding: 22px 100px; font-size: 1.6rem; font-weight: bold; letter-spacing: 10px; 
            color: #333; border: none; border-radius: 20px; 
            background: linear-gradient(145deg, #1a1a1a, #000); 
            box-shadow: 10px 10px 25px #000, -3px -3px 10px #222;
            cursor: not-allowed; transition: 0.4s;
        }
        .enter-btn-3d.ready { 
            color: #ffd700; border: 2px solid #ffd700; cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }
        .enter-btn-3d.ready:hover { 
            background: #ffd700; color: #000; box-shadow: 0 0 50px #ffd700; 
            transform: scale(1.05);
        }

        /* 내부 지휘소 (내용은 동일) */
        #main-hr { width: 100%; height: 100vh; display: none; flex-direction: column; justify-content: center; align-items: center; background: #000; }
        .hr-box { border: 10px double #ffd700; padding: 60px; box-shadow: 0 0 60px gold; text-align: center; }
    </style>
</head>
<body>

    <div id="entry-screen">
        <div class="gold-logo-3d"><span>WBPC</span></div>
        <h2 id="top-title">접속할 국가 섹터를 선택하십시오</h2>
        
        <div class="country-selector">
            <button class="btn-3d" data-name="대한민국" onclick="selectCountry(this, '대한민국')"><span>🇰🇷</span></button>
            <button class="btn-3d" data-name="태국" onclick="selectCountry(this, '태국')"><span>🇹🇭</span></button>
            <button class="btn-3d" data-name="라오스" onclick="selectCountry(this, '라오스')"><span>🇱🇦</span></button>
            <button class="btn-3d" data-name="미얀마" onclick="selectCountry(this, '미얀마')"><span>🇲🇲</span></button>
        </div>

        <button id="enter-button" class="enter-btn-3d" onclick="openGate()">SYSTEM ENTER</button>
    </div>

    <div id="main-hr">
        <div class="hr-box">
            <h1 style="font-size: 3.5rem; letter-spacing: 15px;">WBPC GLOBAL HR</h1>
            <p id="sector-info" style="color: #fff; letter-spacing: 5px; font-size: 2rem; margin-top: 20px;"></p>
            <div style="margin-top:30px; color:#00ff00; font-family:monospace; font-size: 1.1rem;">
                > SECURE PROTOCOL ACTIVATED<br>
                > AUTHORIZED ACCESS ONLY
            </div>
        </div>
    </div>

    <script>
        let selectedSector = "";

        function selectCountry(element, country) {
            document.querySelectorAll('.btn-3d').forEach(btn => btn.classList.remove('selected'));
            element.classList.add('selected');
            selectedSector = country;
            
            const enterBtn = document.getElementById('enter-button');
            enterBtn.classList.add('ready');
            
            document.getElementById('top-title').innerText = country + " SECTOR ACTIVE";
            document.getElementById('top-title').style.color = "#ffd700";
        }

        function openGate() {
            if(!selectedSector) return;
            document.getElementById('entry-screen').style.opacity = '0';
            document.getElementById('sector-info').innerText = selectedSector + " STRATEGIC COMMAND";
            setTimeout(() => {
                document.getElementById('entry-screen').style.display = 'none';
                document.getElementById('main-hr').style.display = 'flex';
            }, 800);
        }
    </script>
</body>
</html>
