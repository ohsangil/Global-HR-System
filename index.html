<div id="signup-master-process" style="width: 100%; max-width: 900px; margin: 0 auto; color: #fff;">
    
    <div style="display: flex; justify-content: center; gap: 20px; margin-bottom: 40px;">
        <div id="step-dot-1" style="width: 50px; height: 5px; background: gold;"></div>
        <div id="step-dot-2" style="width: 50px; height: 5px; background: #333;"></div>
        <div id="step-dot-3" style="width: 50px; height: 5px; background: #333;"></div>
        <div id="step-dot-4" style="width: 50px; height: 5px; background: #333;"></div>
    </div>

    <div id="registration-step-1" style="background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); border: 1px solid rgba(212, 175, 55, 0.3); padding: 50px; border-radius: 30px; text-align: center;">
        <h2 style="color: gold; letter-spacing: 5px;">STEP 01. 신원 명단 확인</h2>
        <p style="color: #ccc; margin: 30px 0; line-height: 1.8;">
            본 시스템은 <b>현지 송출업체(사무실)</b>에서 제출한 공식 명단에<br>
            성명과 정보가 등록된 인원만 가입이 가능합니다.
        </p>

        <div style="background: #000; padding: 30px; border-radius: 15px; margin-bottom: 30px;">
            <input type="text" id="reg-name" placeholder="여권상 영문 성명 입력" style="width: 80%; padding: 15px; background: transparent; border: none; border-bottom: 2px solid gold; color: gold; text-align: center; font-size: 1.2rem; outline: none;">
        </div>

        <button onclick="nextStep(2)" style="padding: 15px 60px; background: gold; color: #000; font-weight: bold; border: none; border-radius: 5px; cursor: pointer;">명단 확인 요청</button>
        
        <p style="margin-top: 25px; color: #ff4444; font-size: 0.8rem; display: none;" id="error-msg">
            명단에 정보가 없습니다. 현지 사무실로 연락하여 사진 명단을 업데이트하십시오.
        </p>
    </div>
</div>
